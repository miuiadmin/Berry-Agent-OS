apiVersion: berry.agent.v1
name: memory
version: "0.1.0"
description: "记忆智能：判断该不该记、智能召回、矛盾检测、清理整理"
level: 3
kind: on-demand
source: bundled
taskTypes:
  - memory_judge
  - memory_recall
  - memory_cleanup
  - memory_organize
roles: []
entry: entry.ts
ipcProtocol: module-agent
requiresBrainReview: false
capabilitiesProvided:
  - name: memory_judge
    description: "判断对话是否包含值得长期记忆的信息"
    dangerLevel: safe
  - name: memory_recall
    description: "智能召回与当前上下文相关的记忆"
    dangerLevel: safe
  - name: memory_cleanup
    description: "清理过期/低价值记忆"
    dangerLevel: moderate
  - name: memory_organize
    description: "去重、合并相似记忆"
    dangerLevel: moderate
capabilitiesRequired:
  - memory_read
  - memory_write
  - memory_delete
  - memory_search
modelTier: fast
maxTurns: 5
