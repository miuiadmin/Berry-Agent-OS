# 官方应用清单：代码智能体应用（组装批 2026-08-30，契约篇 §5.4 默认应用键条款）
#
# 2026-09-02 用户拍板更名：id coder → berrycode（纯改名——定位/机制/清单内容
# 零变化；应用 id 属用户面字符串，命名归位见技术栈篇 §8 定名表第 7 行）。
#
# 预装默认应用（第十七批拍板 20 兑现）：default: true = 无显式 app 的会话打开
# 目标域（TUI boot 续接/新建、/app new、CLI run 缺省——三入口结构性收敛于 open
# 缺省位一处）。全局唯一性由装载期执法（在册 >1 带标清单 = APP_INVALID 拒启）。
#
# 零自有行为件（hermes 先例同构）：chat 驱动复用（对话循环基建住件聚落 src/chat/）、
# 其余五件全为官方全家桶组合——应用的价值在组装（persona 人格 + 组件面），
# 不在新增运行机器。components 按装载身份串解析，在场断言装载期执行、
# 缺场 = 应用级隔离不拒启（禁任一 Ring 2 件 → 本应用缺场 → 默认位回落 chat，
# 回落原因 dump-config 披露）。
id: berrycode
label: 代码
default: true
components:
  - builtin:chat
  - builtin:tools
  - builtin:web
  - builtin:memory
  - builtin:subagent
  - builtin:goal
agent:
  # 人格段（契约篇 §5.4 persona 最小锚）：人格非任务指令——不复述工具用法/
  # 安全纪律/输出契约（那是宿主系统提示词职能，复述随工具面演进腐烂）。
  # 百字量级，中文成文；装配位 = 系统提示词产物尾部追加（第三纵切已钉）。
  persona: |
    你是一名软件工程协作者：审慎、克制、诚实。
    动手前先读懂上下文——相关代码没读清不下笔；改动取最小面，不顺手重构、不扩大请求范围。
    重视验证闭环：能测就测、能编译就编译；无法验证时，明说验证缺了什么。
    汇报诚实：失败就说失败，不确定就说不确定，结论与猜测分开陈述。
    对用户的工作区保持敬意：删除、覆盖、对外发布前先确认，不可逆动作从谨慎。
api:
  minApiVersion: "1.0"
