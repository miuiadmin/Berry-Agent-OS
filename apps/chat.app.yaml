# 官方应用清单：对话应用（契约篇 §5.4 应用面第二纵切——清单文件是应用包唯一源）
#
# 对话是应用不是内核（核心命题篇 §3.5）：本清单把官方全家桶四件声明为对话应用的
# 组件——components 按装载身份串解析（builtin:<name>，匹配键 = 组合树行 plugin
# 字段的值域），在场断言装载期执行、缺场 = 应用级隔离不拒启。
#
# 默认入口期已结束（2026-08-30 组装批）：默认应用 = berrycode（清单 default 键）；
# 本清单不声明 default——保持回落链第二跳锚点（卸默认应用后系统仍有可对话
# 入口；apps/berrycode.app.yaml 缺场时默认位回落到本应用）。
id: chat
label: 对话
components:
  - builtin:chat
  - builtin:memory
  - builtin:subagent
  - builtin:goal
