<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪食蛇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        .score {
            font-size: 1.5rem;
            color: #00ff88;
        }

        .high-score {
            font-size: 1.5rem;
            color: #ffd700;
        }

        #gameCanvas {
            border: 3px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
            background: #0a0a0a;
        }

        .controls {
            margin-top: 20px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.1rem;
            border: 2px solid #00ff88;
            background: transparent;
            color: #00ff88;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 10px;
        }

        .btn:hover {
            background: #00ff88;
            color: #1a1a2e;
        }

        .instructions {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #888;
        }

        .instructions kbd {
            background: #333;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #555;
        }

        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            display: none;
        }

        .game-over-text {
            font-size: 3rem;
            color: #ff4444;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 68, 68, 0.5);
        }

        .final-score {
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        .canvas-wrapper {
            position: relative;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐍 贪食蛇</h1>
        <div class="game-info">
            <span class="score">得分: <span id="score">0</span></span>
            <span class="high-score">最高分: <span id="highScore">0</span></span>
        </div>
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="game-over-overlay" id="gameOverOverlay">
                <div class="game-over-text">游戏结束</div>
                <div class="final-score">最终得分: <span id="finalScore">0</span></div>
                <button class="btn" onclick="game.restart()">重新开始</button>
            </div>
        </div>
        <div class="controls">
            <button class="btn" onclick="game.togglePause()" id="pauseBtn">暂停</button>
            <button class="btn" onclick="game.restart()">重新开始</button>
        </div>
        <div class="instructions">
            <p>使用 <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 控制方向</p>
            <p>按 <kbd>空格</kbd> 暂停/继续</p>
        </div>
    </div>

    <script>
        class SnakeGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.gridSize = 20;
                this.tileCount = this.canvas.width / this.gridSize;
                
                this.snake = [];
                this.food = {};
                this.direction = { x: 1, y: 0 };
                this.nextDirection = { x: 1, y: 0 };
                this.score = 0;
                this.highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
                this.gameLoop = null;
                this.gameSpeed = 100;
                this.isPaused = false;
                this.isGameOver = false;
                
                this.init();
            }

            init() {
                document.getElementById('highScore').textContent = this.highScore;
                this.snake = [
                    { x: 5, y: 10 },
                    { x: 4, y: 10 },
                    { x: 3, y: 10 }
                ];
                this.spawnFood();
                this.setupControls();
                this.start();
            }

            setupControls() {
                document.addEventListener('keydown', (e) => {
                    switch(e.key) {
                        case 'ArrowUp':
                        case 'w':
                        case 'W':
                            if (this.direction.y === 0) {
                                this.nextDirection = { x: 0, y: -1 };
                            }
                            break;
                        case 'ArrowDown':
                        case 's':
                        case 'S':
                            if (this.direction.y === 0) {
                                this.nextDirection = { x: 0, y: 1 };
                            }
                            break;
                        case 'ArrowLeft':
                        case 'a':
                        case 'A':
                            if (this.direction.x === 0) {
                                this.nextDirection = { x: -1, y: 0 };
                            }
                            break;
                        case 'ArrowRight':
                        case 'd':
                        case 'D':
                            if (this.direction.x === 0) {
                                this.nextDirection = { x: 1, y: 0 };
                            }
                            break;
                        case ' ':
                            e.preventDefault();
                            this.togglePause();
                            break;
                    }
                });
            }

            start() {
                if (this.gameLoop) clearInterval(this.gameLoop);
                this.gameLoop = setInterval(() => this.update(), this.gameSpeed);
            }

            togglePause() {
                if (this.isGameOver) return;
                
                this.isPaused = !this.isPaused;
                const btn = document.getElementById('pauseBtn');
                
                if (this.isPaused) {
                    clearInterval(this.gameLoop);
                    btn.textContent = '继续';
                    this.drawPauseScreen();
                } else {
                    this.start();
                    btn.textContent = '暂停';
                }
            }

            drawPauseScreen() {
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.ctx.fillStyle = '#fff';
                this.ctx.font = 'bold 30px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.fillText('暂停', this.canvas.width / 2, this.canvas.height / 2);
            }

            spawnFood() {
                do {
                    this.food = {
                        x: Math.floor(Math.random() * this.tileCount),
                        y: Math.floor(Math.random() * this.tileCount)
                    };
                } while (this.snake.some(seg => seg.x === this.food.x && seg.y === this.food.y));
            }

            update() {
                this.direction = { ...this.nextDirection };
                
                const head = {
                    x: this.snake[0].x + this.direction.x,
                    y: this.snake[0].y + this.direction.y
                };

                // 撞墙检测
                if (head.x < 0 || head.x >= this.tileCount || 
                    head.y < 0 || head.y >= this.tileCount) {
                    this.gameOver();
                    return;
                }

                // 撞自己检测
                if (this.snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                    this.gameOver();
                    return;
                }

                this.snake.unshift(head);

                // 吃食物
                if (head.x === this.food.x && head.y === this.food.y) {
                    this.score += 10;
                    document.getElementById('score').textContent = this.score;
                    
                    if (this.score > this.highScore) {
                        this.highScore = this.score;
                        document.getElementById('highScore').textContent = this.highScore;
                        localStorage.setItem('snakeHighScore', this.highScore);
                    }
                    
                    this.spawnFood();
                    
                    // 加速
                    if (this.gameSpeed > 50) {
                        this.gameSpeed -= 2;
                        this.start();
                    }
                } else {
                    this.snake.pop();
                }

                this.draw();
            }

            draw() {
                // 清空画布
                this.ctx.fillStyle = '#0a0a0a';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // 绘制网格（可选，增加视觉效果）
                this.ctx.strokeStyle = '#1a1a1a';
                this.ctx.lineWidth = 0.5;
                for (let i = 0; i <= this.tileCount; i++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(i * this.gridSize, 0);
                    this.ctx.lineTo(i * this.gridSize, this.canvas.height);
                    this.ctx.stroke();
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, i * this.gridSize);
                    this.ctx.lineTo(this.canvas.width, i * this.gridSize);
                    this.ctx.stroke();
                }

                // 绘制蛇
                this.snake.forEach((segment, index) => {
                    if (index === 0) {
                        // 蛇头
                        this.ctx.fillStyle = '#00ff88';
                        this.ctx.shadowBlur = 10;
                        this.ctx.shadowColor = '#00ff88';
                    } else {
                        // 蛇身 - 渐变效果
                        const gradient = 1 - (index / this.snake.length) * 0.5;
                        this.ctx.fillStyle = `rgba(0, 255, 136, ${gradient})`;
                        this.ctx.shadowBlur = 0;
                    }
                    
                    this.ctx.fillRect(
                        segment.x * this.gridSize + 1,
                        segment.y * this.gridSize + 1,
                        this.gridSize - 2,
                        this.gridSize - 2
                    );
                    
                    // 蛇头眼睛
                    if (index === 0) {
                        this.ctx.fillStyle = '#000';
                        this.ctx.shadowBlur = 0;
                        const eyeSize = 3;
                        const eyeOffset = 5;
                        
                        if (this.direction.x === 1) { // 向右
                            this.ctx.fillRect(segment.x * this.gridSize + 12, segment.y * this.gridSize + 5, eyeSize, eyeSize);
                            this.ctx.fillRect(segment.x * this.gridSize + 12, segment.y * this.gridSize + 12, eyeSize, eyeSize);
                        } else if (this.direction.x === -1) { // 向左
                            this.ctx.fillRect(segment.x * this.gridSize + 5, segment.y * this.gridSize + 5, eyeSize, eyeSize);
                            this.ctx.fillRect(segment.x * this.gridSize + 5, segment.y * this.gridSize + 12, eyeSize, eyeSize);
                        } else if (this.direction.y === -1) { // 向上
                            this.ctx.fillRect(segment.x * this.gridSize + 5, segment.y * this.gridSize + 5, eyeSize, eyeSize);
                            this.ctx.fillRect(segment.x * this.gridSize + 12, segment.y * this.gridSize + 5, eyeSize, eyeSize);
                        } else { // 向下
                            this.ctx.fillRect(segment.x * this.gridSize + 5, segment.y * this.gridSize + 12, eyeSize, eyeSize);
                            this.ctx.fillRect(segment.x * this.gridSize + 12, segment.y * this.gridSize + 12, eyeSize, eyeSize);
                        }
                    }
                });

                // 绘制食物
                this.ctx.fillStyle = '#ff4444';
                this.ctx.shadowBlur = 15;
                this.ctx.shadowColor = '#ff4444';
                this.ctx.beginPath();
                this.ctx.arc(
                    this.food.x * this.gridSize + this.gridSize / 2,
                    this.food.y * this.gridSize + this.gridSize / 2,
                    this.gridSize / 2 - 2,
                    0,
                    Math.PI * 2
                );
                this.ctx.fill();
                this.ctx.shadowBlur = 0;
            }

            gameOver() {
                this.isGameOver = true;
                clearInterval(this.gameLoop);
                
                document.getElementById('finalScore').textContent = this.score;
                document.getElementById('gameOverOverlay').style.display = 'flex';
            }

            restart() {
                this.isGameOver = false;
                this.isPaused = false;
                this.score = 0;
                this.gameSpeed = 100;
                document.getElementById('score').textContent = '0';
                document.getElementById('pauseBtn').textContent = '暂停';
                document.getElementById('gameOverOverlay').style.display = 'none';
                
                this.snake = [
                    { x: 5, y: 10 },
                    { x: 4, y: 10 },
                    { x: 3, y: 10 }
                ];
                this.direction = { x: 1, y: 0 };
                this.nextDirection = { x: 1, y: 0 };
                
                this.spawnFood();
                this.start();
            }
        }

        // 启动游戏
        const game = new SnakeGame();
    </script>
</body>
</html>
